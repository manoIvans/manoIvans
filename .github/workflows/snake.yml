name: Generate Snake Animation

on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: "0 */12 * * *" 
  workflow_dispatch: # Permite que você rode manualmente clicando num botão no GitHub
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: manoIvans
          outputs: |
            dist/github-snake.svg?color_snake=#D85A30
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E87D0D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
