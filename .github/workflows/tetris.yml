name: Generate Tetris Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Tetris SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: manoIvans
          outputs: |
            dist/tetris-contribution-graph.svg?color_snake=D85A30&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/tetris-contribution-graph-dark.svg?color_snake=D85A30&color_dots=#161b22,#0d4429,#006d32,#26a641,#39d353&color_bg=0d1117

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
